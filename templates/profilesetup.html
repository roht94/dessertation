<!DOCTYPE html>
<html>
<head>
  <title>ProfileSetup</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="../static/css/style.css">
</head>
<body>
 
        <div class="container-fluid">

          <div class="row">
            <div class="col-md-1"></div>
            <div class="col-md-10">
            <center>
            <div class="profile_setup">
              
              
              <h4>Profile Setup</h4>
              <br>
              <form action="/setup" method="POST"> 

              <input type="hidden" name="name" value="{{name}}">
              <input type="hidden" name="email" value="{{email}}">
              <input type="hidden" name="password" value="{{password}}">

              <div class="row" style="margin-bottom: 21px; justify-content: center;">
                <div class="col-md-3">
                  <label for="age"><b>Enter Age</b></label>
                  <input type="number" min="10" max="90" id="age" name="age" class="setup_inputs" style="width: 100%;" required >
                </div>
                <div class="col-md-3">
                  <label for="weight"><b>Enter Weight:</b></label><br>
                  <span style="font-size:10px; font-weight:normal; color:#555; margin-top:-38px; display:block;">(100 lbs = 45.36 kg)</span>
                  <input type="number" min="90" max="600" id="weight" name="weight" placeholder="lb" class="setup_inputs" style="width: 100%;" required >
                </div>
                <div class="col-md-3">
                  <label for="feet"><b>Enter height</b></label>
                  <div class="d-flex" style="gap: 4%;">
                    <input type="number" min="3" max="7" id="feet" placeholder="feet" name="feet" class="setup_inputs" style="width: 48%;" required >
                    <input type="number" min="0" max="12" id="inches" placeholder="inch" name="inches" class="setup_inputs" style="width: 48%;" required >
                  </div>
                </div>
              </div>
              <div class="row" style="margin-bottom: 20px; justify-content: center;">
              	<div class="col-md-3">
                  <label for="gender"><b>Select Gender</b></label>
                  <select name="gender" id="gender" class="setup_inputs" style="width: 100%;" required >
              			<option value="male">Male</option>
              			<option value="female">Female</option>
              		</select>
                </div>
              	<div class="col-md-3">
                  <label for="vegan"><b>Vegan</b></label>
                  <select name="vegan" id="vegan" class="setup_inputs" style="width: 100%;" required >
              			<option value="no">No</option>
              			<option value="yes">Yes</option>	
              		</select>
                </div>
                <div class="col-md-3">
                  <label for="allergy"><b>Allergy</b></label>
                  <select name="allergy" id="allergy" class="setup_inputs" style="width: 100%;" required >
              			<option value="None">None</option>
              			<option value="lactose">Lactose</option>
              			<option value="gluten">Gluten</option>
              			<option value="bean/nuts">Bean/Nuts</option>
              			<option value="egg">Eggs</option>
              			<option value="seafood">Seafood</option>
              		</select>
                </div>
              </div>
              <div class="row" style="margin-bottom: 20px; justify-content: center;">
                <div class="col-md-4">
                  <label for="goal"><b>Select Your Goal</b></label>
                  <select name="goal" id="goal" class="setup_inputs" style="width: 100%;" required >
                    <option value="weight_loss">Weight Loss</option>
                    <option value="weight_gain">Weight Gain</option>
                    <option value="muscle_gain">Muscle Gain</option>
                    <option value="maintenance">Maintenance</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="activity"><b>Activity Level</b></label>
                  <select name="activity" id="activity" class="setup_inputs" style="width: 100%;" required >
              			<option value="sedentary">Sedentary (little or no exercise)</option>
						<option value="lightly active">Lightly active (light exercise/sports 1-3 days/week)</option>
						<option value="moderately active">Moderately active (moderate exercise/sports 3-5 days/week)</option>
						<option value="very active">Very active (hard exercise/sports 6-7 days a week)</option>
						<option value="extra active">Extra active (very hard exercise/sports and a physical job)</option>
              		</select>
              	</div>
              </div>
              <br>
              <input type="submit" value="Next" id="login_register_button"><br><br>
				</form>    
            </div>
          </center>   
          </div>   
          <div class="col-md-1"></div>
          </div>
        </div>
</body>
</html>
